<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Gas Codex</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .card {
      text-align: center;
    }
    h1 {
      font-size: 42px;
      font-weight: 700;
      background: linear-gradient(135deg, #4f8cff, #9d5cff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      color: #8888a0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, Gas Codex!</h1>
    <p>Windows + macOS · Tauri 2 · v0.1.0</p>
  </div>
</body>
</html>
